<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scentara Signin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="logo-signin">
        <h1>Scentara</h1>
        <h2>Welcome back!</h2>
    </div>

    <div class="signin-container">

        <div class="signin-text">
            <p>Sign in</p>
        </div>

        <div class="email">
            <p>Email:</p>
            <input type="email" placeholder="johndoe@example.com">
        </div>

        <div class="password">
            <p>Password:</p>
            <input type="password" placeholder="Enter password">
        </div>

        <div class="signin-button">
            <button class="login">Log in</button>
        </div>

        <div class="create-account">
            <p>Don't have an account? 
                <a href="#">Sign up.</a>
            </p>
        </div>

    </div>

    <div class="signin-with-other">
        <a href="#">Sign in with <img src="./assets/Google_Favicon_2025.svg.webp" alt="Sign in with Google" /></a>
        <a href="#">Sign in with <img src="./assets/Apple_logo_white.svg.png" alt="Sign in with Apple" /></a>
    </div>

</body>
</html>
